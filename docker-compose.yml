services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    entrypoint: [ "/usr/local/bin/app-entrypoint.sh" ]
    volumes:
      - './src:/var/www/html'
    ports:
      - "${VITE_PORT:-5173}:5173"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "${APP_PORT:-81}:80"
    volumes:
      - './src:/var/www/html'
      - './docker/nginx/conf.d:/etc/nginx/conf.d'
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=only_company
    volumes:
      - './docker/volume/mysql:/var/lib/mysql'
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "${PHPMYADMIN_DASHBOARD_PORT:-9090}:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
    depends_on:
      - mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - './docker/volume/redis:/data'
    command: redis-server --appendonly yes
    restart: unless-stopped

